services:
  radiance-vllm-qwen4exp:
    image: ${R9V_IMAGE:-r9v-qwen38-flash-next:latest}
    container_name: ${R9V_CONTAINER_NAME:-radiance-vllm-qwen4exp}
    network_mode: bridge
    ports:
      - "${R9V_HOST_PORT:-8085}:8004"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "44"   # video
      - "110"  # render
    security_opt:
      - label=disable
    shm_size: "32g"
    ipc: host
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ${R9V_MODEL_DIR:-${HOME}/LLM-Models/qwen38-r9v}:/models:ro
      - ${R9V_DATA_DIR:-${HOME}/r9v-data}:/r9v-data:rw
      - ${R9V_CACHE_DIR:-${HOME}/r9v-data/cache}:/root/.cache:rw
    environment:
      - VLLM_TARGET_DEVICE=rocm
      - PYTORCH_ROCM_ARCH=gfx1201
      - HIP_ARCHITECTURES=gfx1201
      - AMDGPU_TARGETS=gfx1201
      - GPU_ARCHS=gfx1201
      - HIP_VISIBLE_DEVICES=${R9V_VISIBLE_DEVICES:-0,1}
      - R9V_MTP_SPEC_TOKENS=2
      - R9V_MTP_QUANTIZATION=fp8
      - R9V_TIERED_IQ_MOE_VARIANT=reuse3v2
      - R9V_TIERED_PREFILL_GROUP_SIZE=16
      - R9V_TIERED_EXPERT_CACHE_SLOTS=16
      - R9V_TIERED_EXPERT_CACHE_RANKS=1
      - R9V_ENABLE_FUSED_GDN_MTP=1
      - R9V_PLE_RESIDENCY_MODE=ssd
      - R9V_PLE_PATH=/r9v-data/per_layer_token_embd.iq4_nl.bin
    command:
      - /models
      - --served-model-name
      - ${R9V_SERVED_MODEL_NAME:-qwen3.8-flash-next}
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "131072"
      - --port
      - "8004"
      - --host
      - "0.0.0.0"
    restart: unless-stopped
